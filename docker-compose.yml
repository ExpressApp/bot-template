version: "3.8"

services:
  bot_refactor:
    build: .
    container_name: bot_refactor
    environment: &environment
      - BOT_CREDENTIALS=$BOT_CREDENTIALS  # cts_host@secret_key@bot_id
      - POSTGRES_DSN=postgres://postgres:postgres@bot_refactor-postgres/bot_refactor_db
      - REDIS_DSN=redis://bot_refactor-redis/0
      - DEBUG=true
      - SMARTLOG_DEBUG_HUIDS=$SMARTLOG_DEBUG_HUIDS
    ports:
      - "8000:8000"  # Отредактируйте порт хоста (первый), если он уже занят
    restart: always
    depends_on: &depends_on
      - postgres
      - redis
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    ulimits: &ulimits
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  bot_refactor-worker:
    build: .
    container_name: bot_refactor-worker
    # '$$' prevents docker-compose from interpolating a value
    command: /bin/sh -c 'PYTHONPATH="$$PYTHONPATH:$$PWD" saq app.infrastructure.worker.settings'
    environment: *environment
    restart: always
    depends_on: *depends_on
    logging: *logging
    ulimits: *ulimits

  postgres:
    image: postgres:15.3-alpine
    container_name: bot_refactor-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bot_refactor_db
    restart: always
    volumes:
      - ./.storages/postgresdata:/var/lib/postgresql/data
    logging: *logging

  redis:
    image: redis:7.0-alpine
    container_name: bot_refactor-redis
    restart: always
    volumes:
      - ./.storages/redisdata:/data
    logging: *logging
